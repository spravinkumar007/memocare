name: memocare
description: A memory care application for patients
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Camera & ML
  camera: ^0.10.5
  google_ml_kit: ^0.19.0


  # File handling
  path_provider: ^2.1.1

  # Communication

  # Notifications
  timezone: ^0.9.2
  rxdart: ^0.27.7

  # Sharing
  share_plus: ^7.2.1

  # UI & Images
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0  # Alternative for image caching
  flutter_cache_manager: ^3.3.1  # Alternative for cache management

  # Authentication
  local_auth: ^2.1.7

  # Utils
  intl: ^0.18.1
  uuid: ^4.3.3



  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0

    # AI/ML (optional for advanced features)
  google_generative_ai: ^0.4.6  # For Gemini AI integration
  geolocator: ^13.0.2            # For current location
  send_message: ^1.0.2           # For sending SMS
  url_launcher: ^6.3.1           # For WhatsApp and fallback SMS
  permission_handler: ^11.4.0    # For managing permissions
  flutter_local_notifications: ^18.0.1   # For in‑app notification



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Uncomment and add assets if you have any
  # assets:
  #   - assets/images/
  #   - assets/icons/
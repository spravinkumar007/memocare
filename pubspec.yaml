name: memocare
description: A memory care application for patients
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Camera & ML
  camera: ^0.10.5
  google_ml_kit: ^0.16.0
  permission_handler: ^11.0.1

  # File handling
  path_provider: ^2.1.1

  # Communication
  url_launcher: ^6.2.4

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.2

  # Sharing
  share_plus: ^7.2.1

  # UI & Images
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0  # Alternative for image caching
  flutter_cache_manager: ^3.3.1  # Alternative for cache management

  # Authentication
  local_auth: ^2.1.7

  # Utils
  intl: ^0.18.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Uncomment and add assets if you have any
  # assets:
  #   - assets/images/
  #   - assets/icons/
name: memocare
description: "A Flutter app with patient management and face authentication."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2

  # Camera & Face Auth
  camera: ^0.10.5+9
  google_ml_kit: ^0.19.0
  permission_handler: ^11.3.1

  # Notifications (add these)
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Utilities
  url_launcher: ^6.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true